# Groups GitHub's generated release notes, which the Release workflow uses for a CHANGELOG.md
# entry nobody wrote by hand (docs/publishing.md § Release lines). First matching category wins.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: ✨ Features
      labels: [feature]
    - title: 🔒 Security
      labels: [security]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 🧹 Maintenance
      labels: [refactor, dependencies, documentation]
    - title: Other changes
      labels: ['*']
