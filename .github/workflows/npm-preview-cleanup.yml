# Dist-tag hygiene for npm previews (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482):
# when a PR closes, best-effort remove its moving `pr-<N>` dist-tag from both
# packages. The snapshot *versions* stay on the registry — npm allows unpublish
# only within 72 hours and forbids it with dependents, and untagged prerelease
# versions are inert (never resolved by a plain `npx cezar-cli`).
name: npm preview cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  drop-dist-tag:
    name: Remove pr-<N> dist-tag
    # Fork PRs never published a preview (see ci.yml publish-snapshot guard).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge ref may already be gone for a closed PR, and package
          # names should come from the trunk anyway — not from the PR's code.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Remove dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured — nothing to clean up."
            exit 0
          fi
          # Every published package carries the PR's dist-tag, so every one needs it removed.
          # Names come from the manifests, never hardcoded, so a rename cannot orphan a tag.
          ROOT_PKG=$(node -p "require('./packages/cezar/package.json').name")
          CLIENT_PKG=$(node -p "require('./packages/api-client/package.json').name")
          ALIAS_PKG=$(node -p "require('./alias-cezar/package.json').name")
          for pkg in "$ROOT_PKG" "$CLIENT_PKG" "$ALIAS_PKG"; do
            # Best effort: the tag may never have existed (PR predating the
            # pipeline, or closed before its first green run).
            npm dist-tag rm "$pkg" "$TAG" || echo "no $TAG tag on $pkg (ok)"
          done
