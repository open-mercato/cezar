name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Migration naming sanity
        # New migrations must use a UTC timestamp prefix (YYYYMMDDHHMMSS_) so two
        # branches never collide on a number — see docs/DEVELOPMENT.md. The legacy
        # zero-padded 00xx_ files (<= 0044) predate the convention and are
        # grandfathered. The four historical collisions on `0029_` are now
        # disambiguated to `0029a_…d_` by chronological commit order. This step
        # fails on (a) any new prefix that is neither a 14-digit timestamp nor a
        # grandfathered legacy number (optionally with a single-letter suffix for
        # the 0029 set), and (b) ANY duplicate prefix (no allowlist anymore).
        run: |
          prefixes=$(ls packages/gui/supabase/migrations/*.sql | sed -E 's/.*\/([0-9]+[a-z]?)_.*/\1/')

          # (a) format: 14-digit timestamp, or legacy 4-digit number <= 0044
          # (with an optional `a-z` disambiguating suffix for the 0029 set).
          for p in $prefixes; do
            if echo "$p" | grep -qE '^[0-9]{14}$'; then
              continue
            fi
            base=${p%[a-z]}
            if echo "$p" | grep -qE '^[0-9]{4}[a-z]?$' && [ "$((10#$base))" -le 44 ]; then
              continue
            fi
            echo "Bad migration prefix '$p' — new migrations must be a UTC timestamp (run: date -u +%Y%m%d%H%M%S)."
            exit 1
          done

          # (b) duplicate prefixes — after the 0029 disambiguation, none allowed.
          dups=$(echo "$prefixes" | sort | uniq -d || true)
          if [ -n "$dups" ]; then
            echo "Duplicate migration prefixes: $dups"
            exit 1
          fi

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/gui/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('packages/gui/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Build (topological)
        run: yarn build
        env:
          # Supabase env access is lazy (env.ts throws at call time), but Next
          # prerendering can evaluate it during `next build` — inert values
          # keep the build honest without real secrets in CI.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test
