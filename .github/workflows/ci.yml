name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, build, E2E, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `lts/*` — the current Node LTS, whatever it is on the day the job runs, so
      # the gate follows the release line users actually install on instead of
      # freezing on a version that quietly ages out of support. The floor stays the
      # root manifest's `engines.node`; this is the ceiling we verify against.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run server and cockpit unit suites
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      # Every package the release publishes must be packable — the workspace root is `private`
      # and publishes nothing, so packing THERE just errors ("must have name and version").
      # Named explicitly rather than with `--workspaces`, which would also pack the packages
      # marked private (the cockpit SPA and, for now, the api-client) and vouch for tarballs
      # nobody publishes. `alias-cezar` is not a workspace, so it packs from its own directory.
      - name: Verify release packages
        run: |
          npm pack --dry-run --ignore-scripts -w @open-mercato/cezar
          (cd alias-cezar && npm pack --dry-run --ignore-scripts)

  # npm preview publishing (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482).
  # Publishes a snapshot of both packages after a fully green verify run:
  # same-repo PRs → dist-tag pr-<N>, develop pushes → @develop. `main` pushes do
  # NOT publish — stable `latest` releases are owner-driven and manual via
  # release.yml, so CI never moves `latest`. Without the NPM_TOKEN secret the
  # script degrades to a loud dry run, so this job stays green on unconfigured forks.
  publish-snapshot:
    name: Publish npm snapshot
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky preview comment on PRs
      id-token: write # npm provenance attestation
    # Never cancel mid-publish: an interrupted run could leave the scoped
    # package on the registry without its alias.
    concurrency:
      group: npm-snapshot-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Publish snapshot
        id: snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-snapshot.mjs

      - name: Write workflow summary
        if: steps.snapshot.outputs.attempted == 'true'
        env:
          RESULT: ${{ steps.snapshot.outputs.result }}
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const r = JSON.parse(process.env.RESULT);
          console.log(`## 📦 npm preview ${r.dryRun ? 'dry run (NPM_TOKEN not configured)' : 'published'}`);
          console.log('');
          console.log(`- Version: \`${r.version}\``);
          console.log(`- Dist-tag: \`${r.distTag}\``);
          console.log(`- Packages: \`${r.aliasName}\` → \`${r.rootName}\` → \`${r.apiClientName}\``);
          console.log('');
          console.log('```bash');
          for (const line of r.installLines) console.log(line);
          console.log('```');
          EOF

      - name: Comment preview on PR
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.attempted == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.snapshot.outputs.result }}
        with:
          script: |
            const marker = '<!-- cezar-npm-preview -->';
            const r = JSON.parse(process.env.RESULT);
            const lines = r.installLines.map((l) => `    ${l}`).join('\n');
            const banner = r.dryRun
              ? '\n> ⚠️ **Dry run** — the `NPM_TOKEN` secret is not configured, so nothing was actually published. See `docs/publishing.md` for the one-time admin setup.\n'
              : '';
            const body = [
              marker,
              `### 📦 npm preview ${r.dryRun ? 'dry run' : 'published'} — \`${r.version}\``,
              banner,
              'Try this PR build (exact pinned version — copy-paste as-is):',
              '',
              lines,
              '',
              `Also tagged: \`npm install -g ${r.aliasName}@${r.distTag}\` (moving tag for this PR).`,
              `Packages: \`${r.aliasName}@${r.version}\` → \`${r.rootName}@${r.version}\` → \`${r.apiClientName}@${r.version}\`${r.dryRun ? '' : ' (provenance attested)'}.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
