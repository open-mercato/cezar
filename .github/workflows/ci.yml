name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint (oxlint)
        run: yarn lint

      - name: Format check (oxfmt)
        run: yarn format:check

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

      - name: Migration naming sanity
        # New migrations must use a UTC timestamp prefix (YYYYMMDDHHMMSS_) so two
        # branches never collide on a number — see docs/DEVELOPMENT.md. The legacy
        # zero-padded 00xx_ files (<= 0044, four of them sharing 0029) predate the
        # convention and are grandfathered. This step fails on (a) any new prefix
        # that is neither a 14-digit timestamp nor a grandfathered legacy number,
        # and (b) any two migrations sharing a numeric prefix (0029 allowlisted).
        run: |
          prefixes=$(ls packages/gui/supabase/migrations/*.sql | sed -E 's/.*\/([0-9]+)_.*/\1/')

          # (a) format: 14-digit timestamp, or legacy 4-digit number <= 0044
          for p in $prefixes; do
            if echo "$p" | grep -qE '^[0-9]{14}$'; then
              continue
            fi
            if echo "$p" | grep -qE '^[0-9]{4}$' && [ "$((10#$p))" -le 44 ]; then
              continue
            fi
            echo "Bad migration prefix '$p' — new migrations must be a UTC timestamp (run: date -u +%Y%m%d%H%M%S)."
            exit 1
          done

          # (b) duplicate prefixes (legacy 0029 set allowlisted)
          dups=$(echo "$prefixes" | sort | uniq -d | grep -v '^0029$' || true)
          if [ -n "$dups" ]; then
            echo "Duplicate migration prefixes: $dups"
            exit 1
          fi

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: packages/gui/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('packages/gui/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Build (topological)
        run: yarn build
        env:
          # Supabase env access is lazy (env.ts throws at call time), but Next
          # prerendering can evaluate it during `next build` — inert values
          # keep the build honest without real secrets in CI.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  # Apply every Supabase migration, in lexicographic filename order, against a
  # real Postgres — the same order Supabase applies them. This catches SQL that
  # only fails on a clean database (bad ordering, dropped-then-referenced
  # objects, typos) which `next build` / unit tests never exercise.
  apply-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cezar_migrations
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply bootstrap + migrations + smoke asserts
        # A plain postgres:15 is NOT Supabase: it has no `auth` schema and none
        # of the `anon` / `authenticated` / `service_role` API roles that the
        # migrations' FKs, RLS policies, and GRANTs depend on. ci-bootstrap.sql
        # is a minimal CI-only stand-in for those (it lives outside
        # migrations/ so the numbering-sanity check and this apply loop ignore
        # it). The four legacy 0029_* files share a numeric prefix on purpose
        # (see "Migration naming sanity" above) — we do NOT renumber them and
        # rely solely on lexicographic filename sort for a deterministic order.
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: cezar_migrations
        run: |
          set -euo pipefail
          cd packages/gui/supabase

          psql -v ON_ERROR_STOP=1 -q -f ci-bootstrap.sql

          for f in $(ls migrations/*.sql | sort); do
            echo "--- applying ${f}"
            psql -v ON_ERROR_STOP=1 -q -f "${f}"
          done

          echo "--- running smoke assertions"
          psql -v ON_ERROR_STOP=1 -q -f ci-smoke-asserts.sql

          echo "All migrations applied cleanly."
