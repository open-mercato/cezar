name: Release

# Starts the next version of ONE release line (docs/publishing.md § Release lines). Run it from
# the `release/vX.Y.x` branch to ship. It picks the version (a patch bump once x.y.z is released;
# a fresh line's x.y.0 as committed; a tagged-but-unreleased version is reported, never re-cut),
# commits the bump to the line, verifies and builds that commit, then tags it as the release App.
# The tag starts release-publish.yml, which publishes AT the tag so npm provenance attests the
# shipped commit. Never runs from a push (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan, stamp, verify and build without committing or tagging anything'
        required: false
        default: false
        type: boolean

# Every write uses the App token; this job's own token only reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dispatch from the BRANCH: workflow_dispatch reads this file from the ref it runs on.
    # `main` is never released directly — cut a line from it with release-cut.yml.
    if: startsWith(github.ref, 'refs/heads/release/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The line's tip, not the dispatch commit: "Re-run jobs" replays the dispatch SHA, which
          # predates a bump commit an earlier attempt already pushed.
          ref: ${{ github.ref_name }}
          fetch-depth: 0 # every v* tag: the next version is chosen from them

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci


      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Bump the release branch
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/release-line.mts prepare ${{ inputs.dry_run && '--dry-run' || '' }}

      # The bump commit was made through the API (signed); verify and tag exactly that commit.
      - name: Check out the bump commit
        if: ${{ !inputs.dry_run }}
        env:
          SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          git fetch --no-tags origin "$SHA"
          git checkout --force --detach "$SHA"

      # Before the tag: a tag pins a commit for good, so it must only ever name one that passes.
      - name: Verify before tagging
        run: |
          npm run typecheck
          npm run test:unit
          npm test

      - name: Build application
        run: npm run build

      - name: Preview the release notes
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SHA: ${{ steps.prepare.outputs.sha }}
        run: node scripts/release-line.mts announce --dry-run --version "$VERSION" --sha "$SHA" --dist-tag latest

      # Installation tokens live one hour; the verify + build above can take a good part of it.
      - name: Mint a fresh release token
        if: ${{ !inputs.dry_run }}
        id: app-token-tag
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token-tag.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SHA: ${{ steps.prepare.outputs.sha }}
        run: node scripts/release-line.mts tag --version "$VERSION" --sha "$SHA"

      - name: Write workflow summary
        if: always() && steps.prepare.outputs.version != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          RESUME: ${{ steps.prepare.outputs.resume }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## 🚀 Release ${VERSION} from ${GITHUB_REF_NAME}"
            echo ""
            if [ "$RESUME" = "true" ]; then
              echo "⚠️ \`v${VERSION}\` is tagged but not released. Re-run its **Release publish** run (or run Release publish from the \`v${VERSION}\` tag); fixes merged since ship in the next patch."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "Dry run — nothing was committed or tagged."
            else
              echo "Tagged \`v${VERSION}\`. **Release publish** is publishing it now — see the Actions tab."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
