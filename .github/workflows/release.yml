name: Release

# Publishes the next version of ONE release line (docs/publishing.md § Release lines). Run it from
# the `release/vX.Y.x` branch you want to ship — the "Use workflow from" picker is the only input
# that matters. It bumps the patch first (or ships a fresh line's x.y.0 as committed), commits that
# bump to the branch, then verifies, builds and publishes exactly that commit. Only the newest
# line moves `latest`; an older line publishes under `latest-X.Y`. Never runs from a push
# (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and build the release without committing, publishing or tagging anything'
        required: false
        default: false
        type: boolean

permissions:
  contents: write # the bump commit, the tag and the GitHub Release
  id-token: write # npm provenance attestation
  pull-requests: write # the PR carrying the changelog entry back to main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dispatch from the BRANCH: workflow_dispatch reads this file from the ref it runs on.
    # `main` is never released directly — cut a line from it with release-cut.yml.
    if: startsWith(github.ref, 'refs/heads/release/v')
    # Gate the publish behind a required-reviewer approval (Settings → Environments → production).
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every v* tag: the next version is chosen from them

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # scripts/release-line.mjs imports the release decisions from packages/cezar/dist.
      - name: Build release tooling
        run: npm run build:server

      - name: Bump the release branch
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: node scripts/release-line.mjs prepare ${{ inputs.dry_run && '--dry-run' || '' }}

      # The bump commit was made through the API (signed); build and publish exactly that commit.
      - name: Check out the bump commit
        if: ${{ !inputs.dry_run }}
        env:
          SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          git fetch --no-tags origin "$SHA"
          git checkout --force --detach "$SHA"

      - name: Verify before release
        run: |
          npm run typecheck
          npm run test:unit
          npm test

      - name: Build application
        run: npm run build

      # Public releases report telemetry under the real service; every other build uses the
      # development id hard-coded in packages/cezar/src/telemetry.ts.
      - name: Stamp telemetry service
        env:
          CEZ_TELEMETRY_SERVICE: ${{ secrets.CEZ_TELEMETRY_SERVICE }}
        run: node packages/cezar/scripts/stamp-telemetry-service.mjs

      - name: Publish to npm
        id: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.prepare.outputs.distTag }}
        run: node scripts/release.mjs existing --dist-tag "$DIST_TAG" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Tag, GitHub Release and changelog PR
        if: steps.release.outputs.published == 'true'
        id: announce
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SHA: ${{ steps.prepare.outputs.sha }}
          DIST_TAG: ${{ steps.prepare.outputs.distTag }}
        run: node scripts/release-line.mjs announce --version "$VERSION" --sha "$SHA" --dist-tag "$DIST_TAG"

      - name: Write workflow summary
        if: always() && steps.prepare.outputs.version != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DIST_TAG: ${{ steps.prepare.outputs.distTag }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          RUN_ALIAS_NAME: ${{ steps.release.outputs.runAliasName }}
          CHANGELOG_PR: ${{ steps.announce.outputs.changelogPr }}
        run: |
          {
            echo "## 🚀 Release ${VERSION} from ${GITHUB_REF_NAME}"
            echo ""
            if [ "$PUBLISHED" = "true" ]; then
              echo "Published \`${RUN_ALIAS_NAME}@${VERSION}\` under \`${DIST_TAG}\` and tagged \`v${VERSION}\`."
              [ -n "$CHANGELOG_PR" ] && echo "" && echo "Changelog entry carried to main: ${CHANGELOG_PR}"
            else
              echo "⚠️ Dry run — nothing was committed, published or tagged (\`dry_run\` input, or \`NPM_TOKEN\` missing; see \`docs/publishing.md\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
