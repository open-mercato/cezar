name: Python cockpit

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/v*'
    paths: &paths
      - 'app/**'
      - 'tests/**'
      - 'e2e/**'
      - 'static/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/python.yml'
  push:
    branches:
      - main
      - develop
      - 'release/v*'
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -q

  e2e:
    name: Browser walks (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group e2e

      - name: Install Chromium
        run: uv run --group e2e playwright install --with-deps chromium

      - name: Run browser walks
        run: uv run --group e2e pytest e2e -q
