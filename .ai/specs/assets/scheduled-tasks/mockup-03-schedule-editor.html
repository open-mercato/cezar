<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled task editor and occurrence history</title><desc id="desc">Three-section editor using existing task controls, a recurring schedule preview, cost summary and recent occurrence history.</desc>
  <style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#f4f4f5}.muted{fill:#a1a1aa}.soft{fill:#71717a}.small{font-size:12px}.body{font-size:14px}.label{font-size:13px;font-weight:650}.h2{font-size:17px;font-weight:700}.title{font-size:23px;font-weight:700}.field{fill:#121214;stroke:#3b3b42}.panel{fill:#171719;stroke:#38383e}.chip{fill:#202024;stroke:#3b3b42}.on{fill:#23301e;stroke:#79b94d}.green{fill:#a6e56a}.amber{fill:#efb260}</style>
  <rect width="1440" height="900" fill="#0d0d0f"/><rect x="0" y="0" width="1440" height="58" fill="#151517"/><line x1="0" y1="58" x2="1440" y2="58" stroke="#303034"/><rect x="22" y="15" width="29" height="29" rx="8" fill="#d8ff75"/><circle cx="36.5" cy="29.5" r="7" fill="#232326"/><text x="63" y="36" class="label">cezar</text><text x="113" y="36" class="small muted">/ Scheduled / Morning issue triage</text><text x="1355" y="36" class="small muted">Saved 2m ago</text>
  <text x="86" y="108" class="title">Edit scheduled task</text><text x="86" y="134" class="body muted">Timing and task choices are saved together. Already launched occurrences never change.</text>
  <g transform="translate(86 164)"><rect width="1268" height="176" rx="14" class="panel"/><circle cx="28" cy="31" r="13" fill="#d8ff75"/><text x="24" y="36" class="label" style="fill:#17200f">1</text><text x="52" y="36" class="h2">When to run</text><text x="52" y="60" class="small muted">Structured recurrence · exact timezone · one bounded catch-up after downtime</text>
    <text x="28" y="91" class="small soft">REPEAT</text><rect x="28" y="101" width="190" height="43" rx="9" class="field"/><text x="44" y="128" class="body">Every week ⌄</text><text x="235" y="91" class="small soft">DAYS</text><rect x="235" y="101" width="290" height="43" rx="9" class="field"/><text x="251" y="128" class="body">Mon · Tue · Wed · Thu · Fri</text><text x="542" y="91" class="small soft">TIME</text><rect x="542" y="101" width="126" height="43" rx="9" class="field"/><text x="561" y="128" class="body">08:00</text><text x="685" y="91" class="small soft">TIMEZONE</text><rect x="685" y="101" width="263" height="43" rx="9" class="field"/><text x="701" y="128" class="body">Europe/Warsaw · UTC+2 ⌄</text><rect x="968" y="88" width="271" height="65" rx="9" fill="#20281c" stroke="#455b39"/><text x="984" y="111" class="small green">Next five</text><text x="984" y="132" class="small muted">Mon 08:00 · Tue 08:00 · Wed 08:00</text><text x="984" y="147" class="small muted">Thu 08:00 · Fri 08:00</text></g>
  <g transform="translate(86 356)"><rect width="1268" height="218" rx="14" class="panel"/><circle cx="28" cy="31" r="13" fill="#d8ff75"/><text x="24" y="36" class="label" style="fill:#17200f">2</text><text x="52" y="36" class="h2">What task to run</text><text x="52" y="60" class="small muted">The same validated task controls as New task. Prompt and workflow are the user’s invention.</text>
    <text x="28" y="92" class="small soft">PROMPT</text><rect x="28" y="103" width="694" height="82" rx="10" class="field"/><text x="44" y="128" class="body">Review open issues created since the last triage. Clarify incomplete reports,</text><text x="44" y="150" class="body">identify duplicates, and prepare actionable implementation guidance.</text><text x="44" y="173" class="small muted">No uploaded images · refer to repository files in the prompt</text>
    <text x="743" y="92" class="small soft">SOURCE AND AGENT</text><rect x="743" y="103" width="248" height="39" rx="19" class="chip"/><text x="761" y="128" class="small">✣ om-auto-manage-issues⌄</text><rect x="1003" y="103" width="88" height="39" rx="19" class="chip"/><text x="1023" y="128" class="small">codex⌄</text><rect x="1103" y="103" width="105" height="39" rx="19" class="chip"/><text x="1123" y="128" class="small">auto model⌄</text>
    <rect x="743" y="153" width="105" height="34" rx="17" class="on"/><text x="760" y="175" class="small">✓ Worktree</text><rect x="860" y="153" width="113" height="34" rx="17" class="on"/><text x="877" y="175" class="small">✓ Autonomous</text><rect x="985" y="153" width="101" height="34" rx="17" class="chip"/><text x="1002" y="175" class="small">×1 variant</text><rect x="1098" y="153" width="110" height="34" rx="17" class="chip"/><text x="1114" y="175" class="small muted">Follow-ups⌄</text></g>
  <g transform="translate(86 590)"><rect width="1268" height="118" rx="14" class="panel"/><circle cx="28" cy="31" r="13" fill="#d8ff75"/><text x="24" y="36" class="label" style="fill:#17200f">3</text><text x="52" y="36" class="h2">Review</text><text x="52" y="62" class="body">Every weekday at 08:00 Europe/Warsaw · up to 5 runs/week · 1 variant</text><text x="52" y="86" class="small muted">Runs only while cezar is open · latest missed time catches up once · next occurrence skips while a prior task is active</text><rect x="1022" y="31" width="102" height="42" rx="10" class="chip"/><text x="1051" y="58" class="label">Pause</text><rect x="1137" y="31" width="102" height="42" rx="10" fill="#d8ff75"/><text x="1164" y="58" class="label" style="fill:#17200f">Save</text></g>
  <g transform="translate(86 728)"><text x="0" y="0" class="h2">Recent occurrences</text><text x="1182" y="0" class="small green">View full history →</text><line x1="0" y1="22" x2="1268" y2="22" stroke="#333338"/><text x="0" y="53" class="small muted">TODAY 08:00</text><text x="144" y="53" class="body green">Launched</text><text x="255" y="53" class="body">Task #7f3a · completed</text><text x="700" y="53" class="small muted">Observed 08:00:02 · due 08:00:00</text><text x="1182" y="53" class="small green">Open task</text><line x1="0" y1="70" x2="1268" y2="70" stroke="#28282c"/><text x="0" y="100" class="small muted">JUL 31 08:00</text><text x="144" y="100" class="body amber">Skipped overlap</text><text x="255" y="100" class="body">Prior task was still in review</text><text x="700" y="100" class="small muted">No replacement backlog created</text></g>
  <text x="1420" y="884" text-anchor="end" class="small soft">Illustrative static mockup</text>
</svg>
