<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Cezar, the grumpy violet pixel cat (the app icon). 16×16 grid, four violets + ink:
       outline #2b1666, body #9146fb, shade #7a2ef0, inner-ear/light #b487fd, pupil #e9d5ff. -->
  <!-- ears -->
  <path fill="#2b1666" d="M2 0h2v1H2zM12 0h2v1h-2zM1 1h1v3H1zM4 1h1v1H4zM11 1h1v1h-1zM14 1h1v3h-1z"/>
  <path fill="#b487fd" d="M2 1h2v2H2zM12 1h2v2h-2z"/>
  <path fill="#2b1666" d="M5 2h1v1H5zM10 2h1v1h-1z"/>
  <path fill="#9146fb" d="M4 2h1v1H4zM11 2h1v1h-1z"/>
  <!-- brow bridge -->
  <path fill="#2b1666" d="M5 3h6v1H5z"/>
  <path fill="#9146fb" d="M2 3h3v1H2zM11 3h3v1h-3z"/>
  <!-- head -->
  <path fill="#2b1666" d="M1 4h1v5H1zM14 4h1v5h-1z"/>
  <path fill="#9146fb" d="M2 4h12v2H2z"/>
  <!-- eyes: heavy lids, light pupils -->
  <path fill="#9146fb" d="M2 6h1v1H2zM6 6h4v1H6zM13 6h1v1h-1z"/>
  <path fill="#2b1666" d="M3 6h1v1H3zM5 6h1v1H5zM10 6h1v1h-1zM12 6h1v1h-1z"/>
  <path fill="#e9d5ff" d="M4 6h1v1H4zM11 6h1v1h-1z"/>
  <!-- muzzle: nose + frown -->
  <path fill="#9146fb" d="M2 7h5v1H2zM9 7h5v1H9z"/>
  <path fill="#2b1666" d="M7 7h2v1H7z"/>
  <path fill="#9146fb" d="M2 8h4v1H2zM7 8h2v1H7zM10 8h4v1h-4z"/>
  <path fill="#2b1666" d="M6 8h1v1H6zM9 8h1v1H9z"/>
  <!-- shoulders -->
  <path fill="#2b1666" d="M0 9h1v6H0zM15 9h1v6h-1z"/>
  <path fill="#9146fb" d="M1 9h14v1H1z"/>
  <!-- chest with the diagonal sash (shade) -->
  <path fill="#9146fb" d="M1 10h3v1H1zM7 10h8v1H7zM1 11h5v1H1zM9 11h6v1H9zM1 12h7v1H1zM11 12h4v1h-4zM1 13h9v1H1zM13 13h2v1h-2z"/>
  <path fill="#7a2ef0" d="M4 10h3v1H4zM6 11h3v1H6zM8 12h3v1H8zM10 13h3v1h-3z"/>
  <!-- base -->
  <path fill="#2b1666" d="M0 15h16v1H0zM1 14h14v1H1z"/>
  <path fill="#9146fb" d="M1 14h11v1H1z"/>
  <path fill="#7a2ef0" d="M12 14h3v1h-3z"/>
</svg>
