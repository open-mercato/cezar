apply plugin: 'com.android.application'

// Release identity (RELEASING-MOBILE.md). The version comes from -PcezarVersionName, which
// mobile-release.yml takes from the mobile-v* tag, else from package.json; the code follows from it.
def releaseVersionName = (findProperty('cezarVersionName') ?: new groovy.json.JsonSlurper()
        .parse(rootProject.file('../package.json')).version).toString()

// Mirrors scripts/release-version.mjs: X.Y.Z-rc.N -> X*1e6 + Y*1e4 + Z*100 + N, a final release ends in 99.
static int releaseVersionCode(String name) {
    def m = name =~ /^(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?$/
    if (!m.matches()) throw new GradleException("cezarVersionName '${name}' is not X.Y.Z or X.Y.Z-rc.N")
    def (major, minor, patch) = [m.group(1), m.group(2), m.group(3)].collect { it as int }
    int build = m.group(4) == null ? 99 : (m.group(4) as int)
    boolean rcInRange = m.group(4) == null || (build >= 1 && build <= 98)
    if (major > 2099 || minor > 99 || patch > 99 || !rcInRange) {
        throw new GradleException("cezarVersionName '${name}' is outside the versionCode scheme")
    }
    return major * 1000000 + minor * 10000 + patch * 100 + build
}

// The upload key, from the environment only. Without all four, a release build is unsigned.
def uploadKey = [
    storeFile    : System.getenv('CEZAR_ANDROID_KEYSTORE'),
    storePassword: System.getenv('CEZAR_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias     : System.getenv('CEZAR_ANDROID_KEY_ALIAS'),
    keyPassword  : System.getenv('CEZAR_ANDROID_KEY_PASSWORD'),
]
def hasUploadKey = uploadKey.values().every { it }

android {
    namespace = "com.openmercato.cezar.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.openmercato.cezar.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode(releaseVersionName)
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile file(uploadKey.storeFile)
                storePassword uploadKey.storePassword
                keyAlias uploadKey.keyAlias
                keyPassword uploadKey.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('cezar: CEZAR_ANDROID_KEYSTORE* not set, the release build is unsigned')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
