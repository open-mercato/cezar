[package]
name = "cezar-desktop"
version = "0.1.10"
description = "Desktop shell for cezar (PoC)"
edition = "2021"
publish = false

[lib]
name = "cezar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-updater = "2"
ctrlc = { version = "3", features = ["termination"] }
# The managed Node runtime (`node_runtime.rs`): the same crates the updater plugin already links.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# The macOS agent trampoline (`disclaim.rs`) calls posix_spawn directly.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Windows links `current` with a junction — a directory link that needs no privilege.
[target.'cfg(windows)'.dependencies]
junction = "1"
