[package]
name = "cezar-desktop"
version = "0.1.2"
description = "Desktop shell for cezar (PoC)"
edition = "2021"
publish = false

[lib]
name = "cezar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-updater = "2"
ctrlc = { version = "3", features = ["termination"] }

# Windows links `current` with a junction — a directory link that needs no privilege.
[target.'cfg(windows)'.dependencies]
junction = "1"
