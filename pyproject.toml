[project]
name = "cezar"
version = "0.1.0"
description = "Python port of cezar: a local cockpit for parallel coding agents."
readme = "MIGRATION.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "litewriter>=0.3.2,<0.4",
    "pyyaml>=6.0.2",
    "stario>=5.2,<6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]
e2e = ["playwright>=1.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "static"

[tool.hatch.build.targets.sdist]
include = ["app", "static", "pyproject.toml", "MIGRATION.md"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests", "e2e"]
extend-exclude = [".agents", ".claude", ".cursor", "packages", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.14"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
