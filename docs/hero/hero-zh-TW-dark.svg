<svg xmlns="http://www.w3.org/2000/svg" width="380" height="261" viewBox="0 0 380 261" role="img" aria-label="Cezar：協調數百個 AI 編碼代理，全天候 24/7。 一個面向 Claude Code、Codex、OpenCode 及其他編碼代理的控制台。在本機或 VPS 上執行代理，自動化多步驟工作流程，並讓它們在你離開時繼續工作。">
  <title>Cezar：協調數百個 AI 編碼代理，全天候 24/7。</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="190" y="35.8" textLength="340.0" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">Cezar：協調數百個 AI 編</text>
    <text x="190" y="73.8" textLength="309.4" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">碼代理，全天候 24/7。</text>
    <text x="190" y="123.4" textLength="330.1" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">一個面向 Claude Code、Codex、</text>
    <text x="190" y="154.4" textLength="332.5" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">OpenCode 及其他編碼代理的控制</text>
    <text x="190" y="185.4" textLength="342.3" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">台。在本機或 VPS 上執行代理，自</text>
    <text x="190" y="216.4" textLength="352.0" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">動化多步驟工作流程，並讓它們在你</text>
    <text x="190" y="247.4" textLength="176.0" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">離開時繼續工作。</text>
  </g>
</svg>
