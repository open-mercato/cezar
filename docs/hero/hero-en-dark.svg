<svg xmlns="http://www.w3.org/2000/svg" width="380" height="330" viewBox="0 0 380 330" role="img" aria-label="Cezar - orchestrate hundreds of AI coding agents, 24/7. One control center for Claude Code, Codex, OpenCode and other coding agents. Run agents locally or on a VPS, automate multi-step workflows, and let them keep working while you're away.">
  <title>Cezar - orchestrate hundreds of AI coding agents, 24/7.</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="190" y="35.8" textLength="267.0" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">Cezar - orchestrate</text>
    <text x="190" y="73.8" textLength="303.5" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">hundreds of AI coding</text>
    <text x="190" y="111.8" textLength="180.4" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">agents, 24/7.</text>
    <text x="190" y="161.4" textLength="353.4" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">One control center for Claude Code,</text>
    <text x="190" y="192.4" textLength="352.2" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">Codex, OpenCode and other coding</text>
    <text x="190" y="223.4" textLength="332.6" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">agents. Run agents locally or on a</text>
    <text x="190" y="254.4" textLength="249.4" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">VPS, automate multi-step</text>
    <text x="190" y="285.4" textLength="283.7" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">workflows, and let them keep</text>
    <text x="190" y="316.4" textLength="260.9" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">working while you're away.</text>
  </g>
</svg>
