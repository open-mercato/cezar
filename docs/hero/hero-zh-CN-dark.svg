<svg xmlns="http://www.w3.org/2000/svg" width="380" height="299" viewBox="0 0 380 299" role="img" aria-label="Cezar：编排数百个 AI 编程智能体，7×24 小时不间断。 一个面向 Claude Code、Codex、OpenCode 及其他编程智能体的控制台。在本地或 VPS 上运行智能体，自动化多步骤工作流，并让它们在你离开时继续工作。">
  <title>Cezar：编排数百个 AI 编程智能体，7×24 小时不间断。</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="190" y="35.8" textLength="340.0" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">Cezar：编排数百个 AI 编</text>
    <text x="190" y="73.8" textLength="258.9" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">程智能体，7×24 小</text>
    <text x="190" y="111.8" textLength="150.0" lengthAdjust="spacingAndGlyphs" font-size="30" font-weight="700" fill="#F0F6FC">时不间断。</text>
    <text x="190" y="161.4" textLength="330.1" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">一个面向 Claude Code、Codex、</text>
    <text x="190" y="192.4" textLength="354.5" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">OpenCode 及其他编程智能体的控制</text>
    <text x="190" y="223.4" textLength="342.3" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">台。在本地或 VPS 上运行智能体，</text>
    <text x="190" y="254.4" textLength="352.0" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">自动化多步骤工作流，并让它们在你</text>
    <text x="190" y="285.4" textLength="176.0" lengthAdjust="spacingAndGlyphs" font-size="22" font-weight="400" fill="#9198A1">离开时继续工作。</text>
  </g>
</svg>
