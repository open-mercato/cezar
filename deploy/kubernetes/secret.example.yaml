# EXAMPLE only — do not commit real values. Create the real Secrets out of band:
#
#   kubectl create secret generic cezar-fleet \
#     --from-literal=token="$(openssl rand -hex 32)"
#
#   kubectl create secret generic cezar-agent-credentials \
#     --from-literal=GH_TOKEN=<token that can clone, push and open PRs on the target repos> \
#     --from-literal=ANTHROPIC_API_KEY=<key>      # for the claude runner
#     # --from-literal=OPENAI_API_KEY=<key>       # for the codex runner
#
# The fleet token must be at least 32 characters; hub and workers read the same Secret.
apiVersion: v1
kind: Secret
metadata:
  name: cezar-fleet
type: Opaque
stringData:
  token: "replace-with-at-least-32-random-characters"
---
apiVersion: v1
kind: Secret
metadata:
  name: cezar-agent-credentials
type: Opaque
stringData:
  GH_TOKEN: ""
  ANTHROPIC_API_KEY: ""
