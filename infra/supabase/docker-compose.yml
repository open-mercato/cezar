name: cezar-supabase

# Local Supabase-shaped stack for cezar dev. Plain `postgres:15` (not
# supabase/postgres) so init is transparent and reproducible:
#   1. db starts, runs init/00-supabase-bootstrap.sql → creates anon /
#      authenticated / service_role / authenticator / supabase_admin /
#      supabase_auth_admin roles, the `auth` schema + `auth.uid()` helpers,
#      and the `_realtime` schema.
#   2. auth (GoTrue) connects as supabase_auth_admin and migrates `auth.users`,
#      `auth.identities`, etc.
#   3. migrator runs packages/gui/supabase/migrations/*.sql once auth is up,
#      then exits.
#   4. rest (PostgREST), realtime, and kong come up.
#
# Endpoints:
#   GUI/runners → http://127.0.0.1:54321   (Kong unified gateway, same URL
#                                            shape as Supabase Cloud)
#   Direct psql → postgres://postgres:postgres@127.0.0.1:54322/postgres
#
# JWT keys below are the well-known Supabase dev keys (public knowledge).
# NEVER reuse this compose for prod.

services:
  db:
    # Stock postgres:15 + wal2json (built locally in infra/supabase/db).
    # `wal2json` is the logical-decoding output plugin supabase/realtime tails;
    # postgres:15-alpine doesn't ship it.
    build:
      context: ./db
    image: cezar-supabase-db:local
    container_name: cezar-supabase-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:54322:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      # supabase/realtime tails the WAL via logical replication. Hosted
      # Supabase sets this for you; on plain postgres:15 we have to opt in.
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  auth:
    image: supabase/gotrue:v2.158.1
    container_name: cezar-supabase-auth
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres?search_path=auth
      DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: 'http://127.0.0.1:3000,http://localhost:3000'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      # GitHub OAuth: opt-in via LOCAL_GITHUB_ENABLED=true in infra/supabase/.env.
      # GoTrue rejects an empty string for the bool, so the default is "false"
      # — set LOCAL_GITHUB_ENABLED=true alongside the client id/secret.
      GOTRUE_EXTERNAL_GITHUB_ENABLED: '${LOCAL_GITHUB_ENABLED:-false}'
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: '${LOCAL_GITHUB_CLIENT_ID:-}'
      GOTRUE_EXTERNAL_GITHUB_SECRET: '${LOCAL_GITHUB_CLIENT_SECRET:-}'
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: 'http://127.0.0.1:54321/auth/v1/callback'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_ADMIN_EMAIL: admin@local.dev
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9999/health']
      interval: 3s
      timeout: 5s
      retries: 30

  migrator:
    image: postgres:15-alpine
    container_name: cezar-supabase-migrator
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ../../packages/gui/supabase/migrations:/migrations:ro
      - ./migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']
    restart: 'no'

  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: cezar-supabase-rest
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: 'false'

  realtime:
    image: supabase/realtime:v2.30.34
    container_name: cezar-supabase-realtime
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      PORT: '4000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: supabase_admin
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: 'false'
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'

  kong:
    image: kong:2.8.1
    container_name: cezar-supabase-kong
    depends_on:
      - auth
      - rest
      - realtime
    restart: unless-stopped
    # kong-entrypoint.sh substitutes JWT keys into the template at boot.
    # Dev defaults are the well-known public Supabase demo keys.
    entrypoint: ['/bin/sh', '/docker-entrypoint-cezar.sh']
    command: ['kong', 'docker-start']
    ports:
      - '127.0.0.1:54321:8000'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
    volumes:
      - ./kong.yml.template:/home/kong/kong.yml.template:ro
      - ./kong-entrypoint.sh:/docker-entrypoint-cezar.sh:ro

volumes:
  db-data:
